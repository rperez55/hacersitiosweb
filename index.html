<style>
  /* Contenedor del banner */
  .banner-container {
    background-color: #333;
    color: white;
    padding: 10px;
    position: fixed;top:0;left:0
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Animación del texto */
  .banner-text {
    white-space: nowrap;
    animation: marquee 18s linear infinite;
    font-family: sans-serif;
    font-size: 40px;
	bannerInterval = setInterval(cambiarBanner, 3000);
  }

  @keyframes marquee {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }

  /* Botón de cerrar */
  .close-btn {
    background: none;
    border: none;
    color: white;
    font-size: 30px;
    cursor: pointer;
    margin-left: 10px;
    z-index: 10;
  }

  /* Ocultar banner */
  .hidden { display: none; }
</style>
</head>
